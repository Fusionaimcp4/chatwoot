name: Build VoxeDesk Widget Staging Image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mcp4ai/voxedesk-selfhost

jobs:
  build-and-push:
    name: Build and push VoxeDesk staging image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch or ref
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
            RAILS_SERVE_STATIC_FILES=true
          tags: |
            ${{ env.IMAGE_NAME }}:widget-v2-staging
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Report image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## VoxeDesk Widget V2 staging image"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Ref | `${GITHUB_REF}` |"
            echo "| Commit | `${GITHUB_SHA}` |"
            echo "| Dockerfile | `docker/Dockerfile` |"
            echo "| Platform | `linux/amd64` |"
            echo "| Staging tag | `${IMAGE_NAME}:widget-v2-staging` |"
            echo "| Commit tag | `${IMAGE_NAME}:${GITHUB_SHA}` |"
            echo "| Digest | `${IMAGE_NAME}@${IMAGE_DIGEST}` |"
            echo ""
            echo "Production and latest tags were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ${IMAGE_NAME}@${IMAGE_DIGEST}"
